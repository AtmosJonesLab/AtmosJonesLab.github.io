name: Update Sapflow Google Sheet Data Daily
# info from GSheet onto website

on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: '0 10 * * *' 
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create fetch script and install dependencies
        run: |
          # Create package.json with node-fetch dependency
          echo '{ "type": "module", "dependencies": { "node-fetch": "^3.3.2" } }' > package.json

          npm install

          # Write the fetch script
          cat <<'EOF' > fetch-data.mjs
          import fetch from 'node-fetch';
          import fs from 'fs';

          const API_KEY = 'AIzaSyDpB6qgW-L1KUPVHIuN0KSjBsMV1za1J0M';
          const SHEET_ID = '1OHvUzHKfyJ9mXn1quFLOMcbknNUwR9RGPwUJbz_bSLY';
          const RANGE = 'nicedata!A1:D';

          const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;

          const run = async () => {
          try {
            const res = await fetch(url.replace(' ', '%20'));
              if (!res.ok) {
                const errorDetails = await res.text();
                throw new Error(`HTTP ${res.status}: ${errorDetails}`);
              }
              const json = await res.json();
              const rows = json.values; // rows[0] = ["Parameter","Epoch","Formatted Time","Value"]

              if (!rows || rows.length < 2) {
                console.warn('No data rows found in Google Sheet.');
                return;
              }

              const isValidDate = epochSec => {
                const d = new Date(Number(epochSec) * 1000);
                return !isNaN(d) && d.getFullYear() >= 1970;
              };

              const newData = {};
              for (let i = 1; i < rows.length; i++) {
                const [param, epoch, formattedTime, value] = rows[i];
                if (!param) continue;
                if (!isValidDate(epoch)) {
                  console.warn(`Skipping row ${i}, invalid date: ${epoch}`);
                  continue;
                }
                if (!newData[param]) newData[param] = { x: [], y: [] };
                newData[param].x.push(Number(epoch));
                newData[param].y.push(value != null ? (isNaN(Number(value)) ? value : Number(value)) : null);
              }

              // Sort each series by time
              for (const key in newData) {
                const combined = newData[key].x.map((x, i) => ({ x, y: newData[key].y[i] }));
                combined.sort((a, b) => a.x - b.x);
                newData[key].x = combined.map(c => c.x);
                newData[key].y = combined.map(c => c.y);
              }

              // Read what workflow 1 already wrote, so we don't clobber it
              let existingData = {};
              try {
                existingData = JSON.parse(fs.readFileSync('prettySapData.json', 'utf8'));
              } catch (err) {
                console.warn('No existing prettySapData.json found — starting fresh.');
              }

              // For shared keys (battery state, battery voltage) APPEND rather than overwrite,
              // so both sheets' battery readings end up in the same series.
              const mergedData = { ...existingData };
              for (const key in newData) {
                if (mergedData[key]) {
                  const combined = [...mergedData[key].x, ...newData[key].x]
                    .map((x, i) => ({ x, y: [...mergedData[key].y, ...newData[key].y][i] }))
                    .sort((a, b) => a.x - b.x);
                  mergedData[key] = { x: combined.map(c => c.x), y: combined.map(c => c.y) };
                } else {
                  mergedData[key] = newData[key];
                }
              }

              fs.writeFileSync('sapData.json', JSON.stringify(json, null, 2));
              fs.writeFileSync('prettySapData.json', JSON.stringify(mergedData, null, 2));
              console.log('✅ Successfully updated sapData.json and prettySapData.json');
            } catch (err) {
              console.error(`❌ Failed to fetch data from ${url}:`, err.message);
              process.exit(1);
            }
          };
          run();
          EOF

          # Run the script
          node fetch-data.mjs
        env:
          API_KEY: AIzaSyDpB6qgW-L1KUPVHIuN0KSjBsMV1za1J0M
          SHEET_ID: 1OHvUzHKfyJ9mXn1quFLOMcbknNUwR9RGPwUJbz_bSLY
          # updated api and sheet id by ang
          
      - name: Commit and push changes
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sapData.json
          git commit -m "Update sapData.json from Google Sheets" || echo "No changes to commit"
          git config --unset-all credential.helper || true
          git remote set-url origin https://x-access-token:${PERSONAL_ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git remote -v
          echo "PAT length: ${#PERSONAL_ACCESS_TOKEN}"
          git push
